[project]
name = "cyborg-hvac"
version = "0.1.0"
description = "Home Assistant integration for ducted air conditioners with zone control"
requires-python = ">=3.13"
license = "MIT"

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [".venv", "dev"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S", "PT", "D"]
ignore = [
  "D203", "D213", "D105", "D107",
  "S101",   # asserts are fine in tests and type narrowing
  "RUF001", "RUF002", "RUF003",  # degree signs in strings
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S"]
"tests_ha/**" = ["D", "S"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components"]
combine-as-imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
